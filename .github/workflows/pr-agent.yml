name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/') &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check OpenAI configuration
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo '::error::Add the OPENAI_KEY repository Actions secret to enable PR-Agent.'
            exit 1
          fi
      # Never check out or execute PR code in this privileged job.
      - name: Run PR-Agent
        # PR-Agent 0.49.0-github_action, pinned to the published image digest.
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG__MODEL: gpt-6.1-sol
          CONFIG__FALLBACK_MODELS: '["gpt-6-luna"]'
          CONFIG__RESTRICTED_MODE: "true"
          # Keep configuration in the base-branch workflow, not a PR's settings file.
          CONFIG__USE_REPO_SETTINGS_FILE: "false"
          CONFIG__REPO_CONTEXT_FILES: '["CODING_STANDARDS.md", "docs/testing.md"]'
          CONFIG__REPO_CONTEXT_MAX_LINES: "1200"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
