name: CI layout benchmark (disposable)
run-name: ci-bench-${{ inputs.layout || 'seed' }}-${{ inputs.trial || 'bootstrap' }}${{ inputs.profile && '-profile' || '' }}

on:
  push:
    branches: [perf/ci-layout-benchmark]
  workflow_dispatch:
    inputs:
      layout:
        type: choice
        options: [seed, combined, split]
        required: true
      trial:
        type: string
        required: true
      seed_run:
        type: string
        description: Successful seed run containing the immutable cache snapshot
      profile:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: disposable-ci-layout-benchmark
  cancel-in-progress: false

env:
  MISE_JOBS: 1

jobs:
  seed:
    if: github.event_name == 'push' || inputs.layout == 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.4
          cache: true
          cache_save: false
      - name: Resolve Go cache paths
        id: paths
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      # Bootstrap read-only from main, then freeze one artifact for every trial.
      # Never save/delete Actions caches: the repository is already near quota.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: go-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ hashFiles('go.sum') }}
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.paths.outputs.build }}
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ hashFiles('go.sum') }}-benchmark-bootstrap
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ hashFiles('go.sum') }}-
      - name: Warm all build selections and freeze the snapshot
        run: python scripts/ci_benchmark.py seed
      - uses: actions/upload-artifact@v7
        with:
          name: ci-benchmark-cache
          path: .data/ci-benchmark/snapshot/
          compression-level: 0
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ci-benchmark-manifest
          path: |
            .data/ci-benchmark/snapshot/SHA256SUMS
            .data/ci-benchmark/snapshot/environment.json
            .data/ci-benchmark/snapshot/frontend.json
            .data/ci-benchmark/snapshot/Dockerfile.frozen
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seed-evidence
          include-hidden-files: true
          path: .data/ci-benchmark/evidence/
          retention-days: 14

  work:
    if: github.event_name == 'workflow_dispatch' && inputs.layout != 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.layout == 'combined' && '["combined"]' || '["checks","unit","integration","e2e"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.4
          cache: true
          cache_save: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-benchmark-cache
          path: .data/ci-benchmark/snapshot/
          run-id: ${{ inputs.seed_run }}
          github-token: ${{ github.token }}
      - name: Restore immutable Go caches
        run: python scripts/ci_benchmark.py restore
      - name: Run selected backend work
        env:
          BENCH_LANE: ${{ matrix.lane }}
          BENCH_PROFILE: ${{ inputs.profile }}
        run: python scripts/ci_benchmark.py "$BENCH_LANE"
      - name: Verify clean working tree
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.lane }}
          include-hidden-files: true
          path: .data/ci-benchmark/evidence/
          retention-days: 14
          if-no-files-found: error

  web:
    if: github.event_name == 'workflow_dispatch' && inputs.layout != 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.4
          cache: true
          cache_save: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-benchmark-manifest
          path: .data/ci-benchmark/snapshot/
          run-id: ${{ inputs.seed_run }}
          github-token: ${{ github.token }}
      - name: Verify frozen environment
        run: python scripts/ci_benchmark.py verify
      - name: Run unchanged frontend checks
        env:
          BENCH_PROFILE: ${{ inputs.profile }}
        run: python scripts/ci_benchmark.py web
      - name: Verify clean working tree
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-web
          include-hidden-files: true
          path: .data/ci-benchmark/evidence/
          retention-days: 14

  gate:
    needs: [work, web]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.layout != 'seed'
    runs-on: ubuntu-latest
    steps:
      - name: Require complete successful work
        env:
          BACKEND: ${{ needs.work.result }}
          WEB: ${{ needs.web.result }}
        run: test "$BACKEND" = success && test "$WEB" = success
