name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MISE_JOBS: 1

jobs:
  backend:
    runs-on: ubuntu-latest
    # Race-enabled Core tests build the full MCP catalog on every startup.
    # Bound competing startups instead of exhausting lifecycle test deadlines.
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      # Dependencies are immutable for go.sum; compiled artifacts need fresh
      # snapshots. PRs restore main's caches without filling storage per commit.
      - name: Restore Go dependencies
        id: go-module-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.modules }}
          key: go-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-
      - name: Restore Go build artifacts
        id: go-build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.build }}
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.sum') }}-
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-
      - name: Run checks
        run: mise run validate-backend
      - name: Verify clean working tree
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Save Go dependencies on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-module-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.modules }}
          key: ${{ steps.go-module-cache.outputs.cache-primary-key }}
      - name: Save Go build artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  # Keep cache deletion permission out of jobs that execute PR code. Limit both
  # namespaces across toolchain/dependency revisions, not just the current key.
  retain-go-caches:
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: main-go-cache-retention
      cancel-in-progress: false
    steps:
      - name: Retain two main snapshots per Go cache namespace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for prefix in go-build-v2- go-modules-v2-; do
            ids=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&key=$prefix&per_page=100" \
              | jq -r --arg prefix "$prefix" '
                  [.[].actions_caches[]
                    | select(.ref == "refs/heads/main" and (.key | startswith($prefix)))]
                  | sort_by(.created_at) | reverse | .[2:][] | .id')
            for id in $ids; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"
            done
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run dashboard tests
        run: mise run web-test
      - name: Install Storybook browser
        run: mise run --skip-deps storybook-browser-install -- --with-deps
      - name: Run story interaction and accessibility checks
        run: mise run --skip-deps storybook-test
      - name: Build Storybook
        run: mise run --skip-deps storybook-build
      - name: Upload Storybook
        uses: actions/upload-artifact@v6
        with:
          name: storybook
          path: web/storybook-static/
          retention-days: 14
      - name: Build dashboard image
        run: docker build -f web/Dockerfile . --tag hearth-web:ci
      - name: Verify clean working tree
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
