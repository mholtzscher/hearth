name: Merge Risk Prototype (Flue)

# Live while the test PR is open: mirrored byte-identical at
# .github/workflows/merge-risk-prototype.yml
# Required repo secret: OPENCODE_API_KEY. GITHUB_TOKEN is automatic.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One assessment per PR: a new push cancels the superseded run so only the
# latest revision posts (via the marker upsert).
concurrency:
  group: merge-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install prototype deps
        working-directory: prototype-merge-risk
        run: npm ci
      - name: Run merge-risk agent (posts or updates the PR comment itself)
        working-directory: prototype-merge-risk
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx flue run src/agents/merge-risk.ts \
            --message "Apply the merge-risk skill to PR #${{ github.event.pull_request.number }} in ${{ github.repository }}, then publish the result with the upsert-merge-risk-comment tool"
