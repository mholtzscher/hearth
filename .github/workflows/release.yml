name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish-images:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ko-build/setup-ko@v0.8
      - name: Publish images
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          KO_DOCKER_REPO="ghcr.io/${GITHUB_REPOSITORY}/hearthd" \
            ko build --bare --tags "${TAG}" ./cmd/hearthd
          KO_DOCKER_REPO="ghcr.io/${GITHUB_REPOSITORY}/hearth-adapter-homeassistant" \
            ko build --bare --tags "${TAG}" ./cmd/hearth-adapter-homeassistant
          KO_DOCKER_REPO="ghcr.io/${GITHUB_REPOSITORY}/hearth-simulator" \
            ko build --bare --tags "${TAG}" ./cmd/hearth-simulator
