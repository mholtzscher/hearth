    @media(max-width:720px){.sidebar .nav-group .nav-button:nth-child(3){display:flex}.segmented button{min-height:34px;min-width:38px}.suggestion{min-height:40px}.chart-summary button{min-height:36px}}

<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg"><defs>

  <div class="app">
    <aside class="sidebar" aria-label="Hearth navigation">
      <div><div class="brand"><svg class="brand-mark" viewBox="0 0 30 34" fill="none" aria-hidden="true"><path d="M4 29V14L15 4l11 10v15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10 28v-7l5-5 5 5v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 25v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>hearth</div><div class="home-label"><span>A little closer to home.</span></div></div>
      <nav class="nav-group" aria-label="Main"><button class="nav-button" data-action="new" title="New conversation"><svg class="icon"><use href="#i-plus"/></svg><span class="nav-text">New conversation</span></button><button class="nav-button" id="nav-saved" data-action="saved" title="Saved dashboards"><svg class="icon"><use href="#i-grid"/></svg><span class="nav-text">Dashboards</span><span class="count" id="saved-count">0</span></button><button class="nav-button" id="nav-automations" data-action="automations" title="Automations"><svg class="icon"><use href="#i-flow"/></svg><span class="nav-text">Automations</span><span class="count" id="automation-count">0</span></button></nav>
      <div class="recent-nav"><div class="nav-label">Conversations</div><button class="nav-button recent selected" id="recent-temperature" data-action="temperature-thread">A feel for the house</button><button class="nav-button recent" id="recent-lights" data-action="lights-thread">Settle in for the evening</button></div>
      <div class="side-bottom"><div class="house-state"><div class="row" style="font-size:11px;margin-bottom:6px"><span class="dot"></span> Your home, connected</div><div class="small">Illustrative household</div></div><button class="nav-button" data-action="developer" title="Developer tools"><svg class="icon"><use href="#i-code"/></svg><span class="nav-text">Developer tools</span></button><button class="prototype" data-action="about" title="About this prototype"><span>Interactive prototype · 01</span><svg class="icon"><use href="#i-info"/></svg></button></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><div class="crumb">Your home <i>/</i> <span id="breadcrumb">A feel for the house</span></div><div class="topbar-right"><span class="tag">SAMPLE DATA</span><button class="icon-btn" data-action="about" aria-label="Prototype guide"><svg class="icon"><use href="#i-info"/></svg></button><span class="avatar" aria-label="Household member">M</span></div></header>
      <div class="mobile-tabs" role="group" aria-label="Workspace panels"><button id="tab-conversation" data-action="conversation-tab" aria-pressed="true">Conversation</button><button id="tab-canvas" data-action="canvas-tab" aria-pressed="false">Canvas <span aria-hidden="true">↗</span></button></div>
      <div class="workspace-body">
        <section class="conversation" aria-label="Conversation with Hearth"><header class="conversation-heading"><div><h1 id="conversation-title">A feel for the house</h1><p class="small">A conversation with your home.</p></div><svg class="icon muted" aria-hidden="true"><use href="#i-chat"/></svg></header><div class="messages" id="messages" role="log" aria-label="Conversation messages" aria-live="polite"></div><div class="composer-wrap"><form class="composer" id="composer"><label for="prompt" class="sr-only">Ask Hearth</label><textarea id="prompt" rows="2" placeholder="Ask a question. Make yourself at home." maxlength="1000" required></textarea><div class="composer-footer"><span class="composer-context"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg> Your home <span style="color:#737d7b">·</span> <span id="context-label">4 rooms in context</span></span><button class="send" id="send" aria-label="Send message" type="submit"><svg class="icon"><use href="#i-up"/></svg></button></div></form><p class="composer-note">Prototype · sample readings and simulated actions</p></div></section>
        <section class="canvas" id="canvas" aria-label="Interactive canvas" tabindex="-1"></section>
      </div>
    </main>
  </div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    // Interaction prototype. No model, API, credentials, or physical-device access.
    // These views model assistant-ui message parts and a shared json-render catalog.
    const $ = (selector) => document.querySelector(selector);
    const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const rooms = [
      {id:'living',name:'Living room',color:'#9dd9c7',values:[20.6,20.7,21,21.2,21.5,21.7,21.8],day:[19.4,19.1,19.3,20,20.3,21,21.8]},
      {id:'kitchen',name:'Kitchen',color:'#e7ce91',values:[20.3,20.5,20.8,21,21.2,21.6,21.4],day:[19.1,18.8,19.2,20.1,20,20.8,21.4]},
      {id:'bedroom',name:'Bedroom',color:'#a3bfdc',values:[19.8,19.7,19.8,19.9,20,20.1,20.2],day:[19.7,19.4,19,19.3,19.6,19.8,20.2]},
      {id:'office',name:'Office',color:'#c7b3e5',values:[20.9,21,21.1,21.5,22,22.4,22.6],day:[19.6,19.4,19.3,20.2,20.5,21.1,22.6]}
    ];
    const storageKey = 'hearth.design.prototype.dashboards.v1';
    function readSaved(){try{const v=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(v)?v.filter(d=>d&&typeof d.id==='string'&&typeof d.title==='string'&&['C','F'].includes(d.unit)&&Array.isArray(d.rooms)&&d.rooms.length&&d.rooms.every(r=>rooms.some(x=>x.id===r))).slice(0,30):[]}catch{return []}}
    const state={view:'temperature',unit:'C',period:'6h',selected:rooms.map(r=>r.id),title:'Whole-home temperature',saved:readSaved(),savedId:null,messages:[],thread:'temperature',busy:false,failNext:false,offline:false,lightOn:true,brightness:65,receipt:'',threshold:23.5,automationStatus:'draft',mobileCanvas:false,lastPrompt:'',showTable:false};
    const initialMessages=[{role:'user',text:'Show me the temperatures throughout the house.'},{role:'assistant',text:'Here’s how the house feels right now. The <strong>office is the warmest at 22.6°C</strong>; the bedroom is a little cooler at 20.2°C.',artifact:'temperature',trace:'Read 4 temperature entities · fetched 6 hours of retained observations',suggestions:['Why is the office warmer?','Let me know if it gets too warm']}];
    state.messages=structuredClone(initialMessages);
    function value(c){return state.unit==='F'?c*9/5+32:c}
    function temp(c){return `${value(c).toFixed(1)}°${state.unit}`}
    function selectedRooms(){return rooms.filter(r=>state.selected.includes(r.id))}
    let toastTimer;
    function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4000)}
    function showCanvas(){state.mobileCanvas=true;updateTabs()}
    function updateTabs(){document.body.classList.toggle('show-canvas',state.mobileCanvas);$('#tab-canvas').setAttribute('aria-pressed',String(state.mobileCanvas));$('#tab-conversation').setAttribute('aria-pressed',String(!state.mobileCanvas))}
    function preview(kind){const details={temperature:['temp',state.title,`${state.selected.length} rooms · temperature trends · °${state.unit}`,'Open dashboard'],automation:['flow','Office temperature alert',state.automationStatus==='enabled'?'Enabled in demo':'Editable workflow · not enabled','Review automation'],lights:['bulb','Living room lighting','Floor lamp · direct controls','Open controls'],evidence:['clock','Why the lamp turned on','3 linked events · retained evidence','Explore the timeline']}[kind];return `<button class="artifact-preview" data-action="open-artifact" data-kind="${kind}"><div class="row spread"><span class="artifact-icon">${icon(details[0])}</span>${icon('expand')}</div><h3>${escapeHTML(details[1])}</h3><span class="small">${details[2]}</span>${kind==='temperature'?`<div class="preview-values" style="grid-template-columns:repeat(${state.selected.length},1fr)">${selectedRooms().map(r=>`<span><small>${r.name}</small>${value(r.values.at(-1)).toFixed(1)}°</span>`).join('')}</div>`:''}<div class="preview-footer" style="${kind!=='temperature'?'margin-top:16px':''}"><span>${details[3]}</span>${icon('arrow')}</div></button>`}
    function renderMessages(){
      const box=$('#messages');
      box.innerHTML=state.messages.length?state.messages.map(m=>m.role==='user'?`<div class="message user">${escapeHTML(m.text)}</div>`:`<article class="message"><div class="agent-label"><span class="agent-symbol" aria-hidden="true">✳</span> Hearth <time>18:00 · demo</time></div><div class="message-content">${m.text}</div>${m.trace?`<details class="trace"><summary>${icon('check')} ${m.trace.split(' · ')[0]}</summary><p>${escapeHTML(m.trace)}<br>Illustrative tool evidence · no API call</p></details>`:''}${m.artifact?preview(m.artifact):''}${m.suggestions?`<div class="suggestions">${m.suggestions.map(s=>`<button class="suggestion" data-action="suggest" data-prompt="${escapeHTML(s)}">${escapeHTML(s)} ${icon('arrow')}</button>`).join('')}</div>`:''}</article>`).join(''):`<div class="empty-chat"><span class="agent-symbol" aria-hidden="true">✳</span><h2>What would make<br>home feel better?</h2><p>Ask about your home, make something useful, or change the mood.</p><div class="suggestions">${['Show me the temperatures','Settle in for the evening','Why did the lamp turn on?'].map(s=>`<button class="suggestion" data-action="suggest" data-prompt="${s}">${s} ${icon('arrow')}</button>`).join('')}</div></div>`;
      if(state.busy)box.insertAdjacentHTML('beforeend','<div class="busy" role="status">Looking through your home…</div>');
      if(state.error)box.insertAdjacentHTML('beforeend',`<div class="error-message" role="alert">The demo connection was interrupted. Your message is still here.<br><button class="btn" data-action="retry">Try again</button></div>`);
      $('#send').disabled=state.busy;$('#prompt').disabled=state.busy;
      $('#context-label').textContent=state.view==='lights'?'Living room in context':`${state.selected.length} rooms in context`;
      box.scrollTop=box.scrollHeight;
    }
    function canvasTop(label,actions=''){return `<div class="canvas-bar"><div class="eyebrow">${icon('grid')} ${label}</div><div class="canvas-actions">${actions}</div></div>`}
    function foot(){return '<div class="canvas-foot"><span>Bound to home data · illustrative snapshot</span><span>Observed at 18:00</span></div>'}
    function chart(){
      const list=selectedRooms(),min=18,max=24,x=(i)=>40+i*70,y=(c)=>170-(c-min)/(max-min)*150;
      const times=state.period==='6h'?['12:00','13:00','14:00','15:00','16:00','17:00','18:00']:['18:00','22:00','02:00','06:00','10:00','14:00','18:00'];
      return `<svg class="chart" viewBox="0 0 480 200" role="img" aria-label="${state.period==='6h'?'Six':'Twenty-four'} hour temperature history. Office is warmest, bedroom is coolest. Exact readings are available in the data table.">${[18,20,22,24].map(v=>`<line x1="40" y1="${y(v)}" x2="460" y2="${y(v)}" stroke="#363d40" stroke-dasharray="3 5"/><text x="0" y="${y(v)+4}">${Math.round(value(v))}°</text>`).join('')}${times.map((t,i)=>`<text x="${x(i)}" y="194" text-anchor="middle">${t}</text>`).join('')}${list.map((r,index)=>{const data=state.period==='6h'?r.values:r.day;return `<polyline points="${data.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${r.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${index%2?'stroke-dasharray="5 3"':''}/><circle cx="460" cy="${y(data.at(-1))}" r="3" fill="${r.color}"/>`}).join('')}</svg><div class="chart-legend">${list.map((r,i)=>`<span><span class="chart-key" style="background:${r.color};${i%2?'background:repeating-linear-gradient(90deg,'+r.color+' 0 4px,transparent 4px 6px)':''}"></span>${r.name}</span>`).join('')}</div><div class="chart-summary"><span>${state.period==='6h'?'Today, 12:00–18:00':'Yesterday 18:00 – today 18:00'} · ${state.unit==='C'?'Celsius':'Fahrenheit'}</span><button data-action="table" aria-expanded="${state.showTable}">${state.showTable?'Hide':'View'} data table</button></div>${state.showTable?`<table class="data-table"><caption class="sr-only">Illustrative ${state.period} temperature observations in degrees ${state.unit==='C'?'Celsius':'Fahrenheit'}</caption><thead><tr><th scope="col">Time</th>${list.map(r=>`<th scope="col">${r.name}</th>`).join('')}</tr></thead><tbody>${times.map((t,i)=>`<tr><th scope="row">${t}</th>${list.map(r=>`<td>${temp((state.period==='6h'?r.values:r.day)[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`:''}`;
    }
    function temperatureView(){return `${canvasTop(state.savedId?'Saved dashboard':'Generated for you',`<button class="btn ghost" data-action="customize">${icon('sliders')} Customize</button><button class="btn" data-action="save">${icon('bookmark')} ${state.savedId?'Save changes':'Save view'}</button>`)}<div class="canvas-title row spread"><div><h2>${escapeHTML(state.title)}</h2><p>A little perspective on every corner of home.</p></div><span class="pill">${state.offline?'1 sensor offline':'Sample readings'}</span></div>${state.offline?'<div class="notice">Bedroom sensor is offline. Its last reading is retained; current temperature is unknown.</div>':''}<div class="metrics">${selectedRooms().map(r=>`<button class="metric" data-action="room" data-room="${r.id}" aria-label="Explore ${r.name} temperature ${temp(r.values.at(-1))}${state.offline&&r.id==='bedroom'?', last known reading':''}"><div class="metric-heading">${icon('temp')}${r.name}</div><div class="metric-reading"><strong>${value(r.values.at(-1)).toFixed(1)}</strong><span>°${state.unit}</span></div><svg class="spark" viewBox="0 0 80 35" aria-hidden="true"><polyline points="${r.values.map((v,i)=>`${i*13},${33-(v-19)*9}`).join(' ')}" fill="none" stroke="${r.color}" stroke-width="1.5"/></svg><div class="metric-bottom"><span class="dot" style="background:${state.offline&&r.id==='bedroom'?'var(--yellow)':r.color}"></span>${state.offline&&r.id==='bedroom'?'Last known · offline':'Observed at 18:00'}</div></button>`).join('')}</div><div class="chart-panel"><div class="chart-top"><h3>The afternoon, in degrees</h3><div class="segmented" aria-label="History period"><button data-action="period" data-period="6h" aria-pressed="${state.period==='6h'}">6h</button><button data-action="period" data-period="24h" aria-pressed="${state.period==='24h'}">24h</button></div></div>${chart()}</div><div class="insight">${icon('leaf')}<div><h3>A warmer afternoon in the office</h3><p>Up ${state.unit==='C'?'1.7°C':'3.1°F'} since noon in the sample history. The readings show the change, but don’t establish its cause.</p></div></div><button class="context-action" data-action="suggest" data-prompt="Let me know if the office gets too warm"><div><h3>Let your home keep an eye on it.</h3><p>Create a temperature alert from this view</p></div>${icon('arrow')}</button>${foot()}`}
    function automationView(){const enabled=state.automationStatus==='enabled';return `${canvasTop('Automation canvas',`<span class="pill">${enabled?'Enabled in demo':'Draft · not enabled'}</span>`)}<div class="canvas-title"><h2>A heads-up when it’s warm.</h2><p>Office temperature alert · proposed by Hearth, reviewed by you.</p></div><div class="flow"><div class="flow-step"><div class="step-head">${icon('temp')} WHEN · temperature is reported</div><div class="step-body">Office temperature is above the threshold.<div class="inline-fields"><label for="trigger-entity">Sensor<select id="trigger-entity" disabled><option>Office temperature</option></select></label><label for="threshold">Above (°C)<input id="threshold" type="number" min="18" max="35" step="0.5" value="${state.threshold}" ${enabled?'disabled':''}></label></div><p class="small" style="margin-top:12px">Each matching observation may trigger a run. This draft has no cooldown.</p></div></div><div class="flow-step"><div class="step-head">${icon('bell')} THEN · send a notification</div><div class="step-body"><h3>Household Discord</h3><p class="muted" style="margin-top:8px">“The office is above ${state.threshold}°C. It might be time to let some air in.”</p></div></div></div>${enabled?`<div class="approval"><h3>${icon('check')} Enabled in this prototype</h3><p>The simulated Core accepted the definition. It will not run against real home data.</p><div class="row"><button class="btn" data-action="simulate-run">Simulate a matching observation</button><button class="btn ghost" data-action="disable-automation">Disable</button></div>${state.run?`<div class="receipt">${icon('check')} Demo run complete · observed ${state.threshold+0.5}°C → notification accepted. No message was sent.</div>`:''}</div>`:`<div class="approval"><h3>Ready when you are.</h3><p>Review the trigger and destination, then enable this workflow. Hearth Core owns validation and execution.</p><div class="row"><button class="btn primary" data-action="approve-automation">${icon('check')} Review & enable</button><button class="btn ghost" data-action="back-temperature">Back to temperatures</button></div></div>`}<div class="canvas-foot"><span>Editable workflow · illustrative definition</span><span>Hearth controls execution</span></div>`}
    function lightsView(){return `${canvasTop('Device controls',`<span class="pill">Demo device</span>`)}<div class="canvas-title"><h2>A softer kind of evening.</h2><p>Living room · floor lamp</p></div><div class="light-scene" style="${!state.lightOn?'background:#191d1f':''}"><div class="lamp" style="--brightness:${state.lightOn?0.4+state.brightness/100:0.25}"></div><div class="lamp-base"></div></div><div class="control-box"><div class="row spread"><div><h3>Floor lamp</h3><p class="small">${state.lightOn?'On · warm white':'Off'}</p></div><button class="switch" role="switch" aria-label="Floor lamp power" aria-checked="${state.lightOn}" data-action="power"></button></div><label for="brightness"><span class="row spread"><span>Brightness</span><output id="brightness-value">${state.brightness}%</output></span><input type="range" id="brightness" min="1" max="100" value="${state.brightness}" ${!state.lightOn?'disabled':''}></label><p class="small" style="margin-top:8px">${state.lightOn?'Release to send a simulated command.':'Turn the lamp on to adjust brightness.'}</p>${state.receipt?`<div class="receipt">${icon('check')} ${escapeHTML(state.receipt)}</div>`:''}</div><div class="insight">${icon('info')}<div><h3>Controls with a clear outcome</h3><p>In Hearth, the command receipt and observed device state stay distinct. This prototype simulates both.</p></div></div><button class="context-action" data-action="suggest" data-prompt="Why did the lamp turn on?"><div><h3>Why is this light on?</h3><p>Follow the automation and device evidence</p></div>${icon('arrow')}</button>${foot()}`}
    function evidenceView(){return `${canvasTop('Event explanation',`<span class="pill">Illustrative evidence</span>`)}<div class="canvas-title"><h2>There’s a story behind the light.</h2><p>Living room floor lamp · sample execution at 17:42</p></div><p class="muted" style="font-size:13px">The <strong style="color:var(--text)">Evening welcome</strong> automation requested the lamp to turn on after motion was detected.</p><ol class="evidence"><li><time>17:42:03.120</time><h3>Living room motion detected</h3><p>An accepted occupancy observation matched the automation’s trigger.</p></li><li><time>17:42:03.148</time><h3>Evening welcome started</h3><p>The retained run links this trigger to its lamp-power command.</p></li><li><time>17:42:03.426</time><h3>Lamp reported on</h3><p>A command-linked observation satisfied the requested state.</p></li></ol><div class="notice">This evidence links the request and observed outcome. It does not prove the command was the only physical cause.</div><button class="btn" data-action="open-artifact" data-kind="lights">${icon('bulb')} Open lamp controls</button>${foot()}`}
    function savedView(){return `${canvasTop('Your dashboards')}<div class="canvas-title"><h2>Made for you. Here to stay.</h2><p>Useful views, kept close. Saved locally in this prototype.</p></div>${state.saved.length?state.saved.map(d=>`<article class="saved-tile">${icon('temp')}<h3>${escapeHTML(d.title)}</h3><p>${d.rooms.length} rooms · °${d.unit} · saved view with data bindings</p><div class="row"><button class="btn" data-action="load-saved" data-id="${escapeHTML(d.id)}">Open dashboard ${icon('arrow')}</button><button class="icon-btn" data-action="delete-saved" data-id="${escapeHTML(d.id)}" aria-label="Delete ${escapeHTML(d.title)}">${icon('close')}</button></div></article>`).join(''):`<div class="empty-state">${icon('bookmark')}<h3>Your first dashboard starts with a question.</h3><p>Generate a view in conversation, customize it, and save it here.</p><button class="btn" data-action="back-temperature">Explore the temperature view</button></div>`}`}
    function automationsView(){return `${canvasTop('Your automations')}<div class="canvas-title"><h2>Small things, taken care of.</h2><p>Build a workflow through conversation. Keep control of what runs.</p></div>${state.automationStatus==='enabled'?`<article class="saved-tile">${icon('flow')}<h3>Office temperature alert</h3><p>Above ${state.threshold}°C → Household Discord · enabled in demo</p><button class="btn" data-action="open-artifact" data-kind="automation">View workflow ${icon('arrow')}</button></article>`:`<div class="empty-state">${icon('flow')}<h3>No enabled automations yet.</h3><p>Start with an alert when the office gets too warm.</p><button class="btn" data-action="suggest" data-prompt="Let me know if the office gets too warm">Create an alert ${icon('arrow')}</button></div>`}`}
    function developerView(){return `${canvasTop('Developer workspace')}<div class="canvas-title"><h2>Under the surface.</h2><p>Inspect the contract behind the experience.</p></div><div class="control-box"><h3>One interface, three places</h3><p class="small" style="margin-top:10px">An assistant-ui message part references a UI artifact. A Hearth-owned json-render registry renders it in the conversation, the canvas, and saved dashboards.</p><pre class="code">React + Vite
 shadcn/ui      → application components
 assistant-ui   → conversation runtime
 json-render    → catalog-based interfaces

Hearth Core
→ current state & retained history
→ validated actions & durable outcomes</pre><p class="small">Proposed catalog: TemperatureGrid, StateHistoryChart, DeviceControl, AutomationDraft, ActionReview, EventTimeline.</p></div><div class="control-box" style="margin-top:16px"><h3>Explore prototype states</h3><label class="toggle-label"><input type="checkbox" id="offline" ${state.offline?'checked':''}> Simulate an offline bedroom sensor</label><label class="toggle-label"><input type="checkbox" id="fail-next" ${state.failNext?'checked':''}> Fail the next conversation request</label><p class="small">No model or home connection is used. The next request can be retried after a simulated failure.</p></div><div class="insight">${icon('code')}<div><h3>Development tools have their own home.</h3><p>The existing entity inspector, adapter health, command history, and NATS views would live in this workspace.</p></div></div>`}
    function renderCanvas(){
      const focused=document.activeElement;
      const focus=focused?.id, action=focused?.dataset.action, period=focused?.dataset.period;
      const views={
        temperature:temperatureView, automation:automationView, lights:lightsView,
        evidence:evidenceView, saved:savedView, automations:automationsView,
        developer:developerView,
        empty:()=>'<div class="blank-canvas"><div class="blank-art" aria-hidden="true"><span></span><span></span><span></span></div><h2>A space for what comes next.</h2><p>Dashboards, controls, and workflows take shape here as you talk to Hearth.</p></div>'
      };
      $('#canvas').innerHTML=`<div class="canvas-inner">${views[state.view]()}</div>`;
      if(focus){
        document.getElementById(focus)?.focus({preventScroll:true});
      }else if(action){
        const candidates=[...$('#canvas').querySelectorAll('[data-action]')];
        candidates.find(node=>node.dataset.action===action&&node.dataset.period===period)?.focus({preventScroll:true});
      }
      $('#saved-count').textContent=state.saved.length;
      $('#automation-count').textContent=state.automationStatus==='enabled'?'1':'0';
      $('#nav-saved').classList.toggle('active',state.view==='saved');
      $('#nav-automations').classList.toggle('active',state.view==='automations');
      $('#recent-temperature').classList.toggle('selected',state.thread==='temperature');
      $('#recent-lights').classList.toggle('selected',state.thread==='lights');
      $('.segmented')?.setAttribute('role','group');
      if($('.chart-top h3'))$('.chart-top h3').textContent=state.period==='6h'?'The afternoon, in degrees':'A day, in degrees';
      updateTabs();
    }
    function render(){renderMessages();renderCanvas();const title=state.thread==='temperature'?'A feel for the house':state.thread==='lights'?'Settle in for the evening':'A new conversation';$('#breadcrumb').textContent=title;$('#conversation-title').textContent=title}
    function resetTemperatureView(){state.title='Whole-home temperature';state.selected=rooms.map(r=>r.id);state.savedId=null;state.period='6h';state.showTable=false}
    function addAssistant(text,artifact,extras={}){state.messages.push({role:'assistant',text,artifact,...extras})}
    async function request(text,retry=false){if(state.busy||!text.trim())return;text=text.trim();if(!retry)state.messages.push({role:'user',text});state.lastPrompt=text;state.error=false;state.busy=true;$('#prompt').value='';state.mobileCanvas=false;render();await new Promise(resolve=>setTimeout(resolve,750));state.busy=false;if(state.failNext){state.failNext=false;state.error=true;render();return}const q=text.toLowerCase();
      if(/why.*(office|warm)|office.*warmer/.test(q)){addAssistant('The office rose from <strong>20.9°C to 22.6°C</strong> in the sample afternoon history. Temperature readings alone can’t explain why. I’d look for heating activity, occupancy, or sunlight evidence before drawing a conclusion.',null,{trace:'Compared retained temperature observations · no cause established',suggestions:['Let me know if it gets too warm']});}
      else if(/why|happen|history|event/.test(q)){state.view='evidence';addAssistant('The <strong>Evening welcome</strong> automation requested the lamp to turn on. Here’s the linked trigger, run, and observed outcome.', 'evidence',{trace:'Read automation run evidence · command satisfied by linked observation'});}
      else if(/alert|automat|notify|let me know|too warm/.test(q)){state.view='automation';addAssistant(state.automationStatus==='enabled'?'Your office alert is enabled in this demo. You can inspect the workflow or simulate a matching observation.':'I’ve drafted an alert for when the <strong>office reports above 23.5°C</strong>, sent to Household Discord. You can edit the threshold before enabling it. Each matching observation can send a notification.', 'automation',{trace:'Prepared an editable draft · no automation enabled'});}
      else if(/light|lamp|evening|dim/.test(q)){state.view='lights';addAssistant('Here are your living room controls. Set the floor lamp to a comfortable level; each change shows its command outcome.', 'lights',{suggestions:['Why did the lamp turn on?']});}
      else if(/temperature|house|room|dashboard/.test(q)){state.view='temperature';resetTemperatureView();addAssistant('Here’s a view of all four rooms, with readings and their afternoon history. Customize it or save it for later.', 'temperature',{trace:'Read 4 temperature entities · fetched sample history',suggestions:['Why is the office warmer?','Let me know if it gets too warm']});}
      else{addAssistant('This prototype models a few home scenarios. Try one below to explore a complete interaction.',null,{suggestions:['Show me the temperatures','Settle in for the evening','Why did the lamp turn on?']});}
      render();$('#prompt').focus();
    }
    let dialogTrigger;
    function openDialog(content){dialogTrigger=document.activeElement;$('#dialog').innerHTML=content;$('#dialog').showModal()}
    function closeDialog(){if($('#dialog').open)$('#dialog').close()}
    $('#dialog').addEventListener('close',()=>{if(dialogTrigger?.isConnected)dialogTrigger.focus()});
    function customize(){openDialog(`<h2 id="dialog-title">Make this view yours.</h2><p class="intro">Choose the rooms and units. The conversation and saved dashboard share the same interface.</p><form id="customize-form"><div class="fields"><label for="view-title">Dashboard title<input id="view-title" value="${escapeHTML(state.title)}" maxlength="64" required></label><label for="unit">Temperature unit<select id="unit"><option value="C" ${state.unit==='C'?'selected':''}>Celsius · °C</option><option value="F" ${state.unit==='F'?'selected':''}>Fahrenheit · °F</option></select></label><fieldset style="border:0;padding:0;margin:0"><legend class="small" style="margin-bottom:12px">Rooms</legend><div class="check-grid">${rooms.map(r=>`<label><input type="checkbox" name="rooms" value="${r.id}" ${state.selected.includes(r.id)?'checked':''}> ${r.name}</label>`).join('')}</div></fieldset></div><p id="customize-error" class="error-text" role="alert"></p><div class="dialog-actions"><button type="button" class="btn ghost" data-action="close-dialog">Cancel</button><button class="btn primary" type="submit">Apply changes</button></div></form>`)}
    function save(){openDialog(`<h2 id="dialog-title">Keep this close.</h2><p class="intro">Save the layout and data bindings as a dashboard. This prototype stores your selection in this browser.</p><form id="save-form"><label for="save-title">Dashboard name<input id="save-title" value="${escapeHTML(state.title)}" maxlength="64" required autofocus></label><p id="save-error" class="error-text" role="alert"></p><div class="dialog-actions"><button type="button" class="btn ghost" data-action="close-dialog">Cancel</button><button class="btn primary" type="submit">${state.savedId?'Update':'Save'} dashboard</button></div></form>`)}
    function about(){openDialog(`<h2 id="dialog-title">Make yourself at home.</h2><p class="intro">Hearth · agent-first experience study / 01</p><div class="stack"><p class="small">Start with the temperature conversation. Open the generated view, change its rooms or units, and save it as a dashboard.</p><p class="small">Then draft a temperature alert, adjust the lamp, or follow the evidence behind an event. Use Developer tools to explore a failed request or offline sensor.</p><div class="notice" style="margin:0">All readings are illustrative. Replies are scripted, device actions are simulated, and saved dashboards stay in this browser.</div><p class="small">Production direction: React + Vite + shadcn/ui, assistant-ui for conversation, json-render for shared interface specs. This standalone prototype explores the experience.</p></div><div class="dialog-actions"><button class="btn ghost" data-action="developer-from-dialog">Developer tools</button><button class="btn primary" data-action="close-dialog">Explore Hearth</button></div>`)}
    document.addEventListener('click',(event)=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
      if(action==='close-dialog'){closeDialog();return}
      if(action==='about'){about();return}
      if(action==='customize'){customize();return}
      if(action==='save'){save();return}
      if(action==='suggest'){request(button.dataset.prompt);return}
      if(action==='retry'){request(state.lastPrompt,true);return}
      if(action==='conversation-tab'){state.mobileCanvas=false;updateTabs();return}
      if(action==='canvas-tab'){showCanvas();return}
      if(action==='new'||action==='temperature-thread'||action==='lights-thread'){
        if(state.busy){toast('Let this demo request finish first.');return}state.error=false;state.mobileCanvas=false;
        if(action==='new'){state.messages=[];state.thread='new';state.view='empty'}
        if(action==='temperature-thread'){state.messages=structuredClone(initialMessages);state.thread='temperature';state.view='temperature'}
        if(action==='lights-thread'){state.messages=[{role:'user',text:'Help me settle in for the evening.'},{role:'assistant',text:'A little softer, a little warmer. Here are your living room controls.',artifact:'lights',suggestions:['Why did the lamp turn on?']}];state.thread='lights';state.view='lights'}render();$('#prompt').focus();return;
      }
      if(action==='open-artifact'){state.view=button.dataset.kind;showCanvas()}
      if(action==='saved'){state.view='saved';showCanvas()}
      if(action==='automations'){state.view='automations';showCanvas()}
      if(action==='developer'||action==='developer-from-dialog'){closeDialog();state.view='developer';showCanvas()}
      if(action==='back-temperature'){state.view='temperature';showCanvas()}
      if(action==='period'){state.period=button.dataset.period}
      if(action==='table'){state.showTable=!state.showTable}
      if(action==='room'){const room=rooms.find(r=>r.id===button.dataset.room);openDialog(`<h2 id="dialog-title">${room.name}</h2><p class="intro">Temperature sensor · illustrative evidence</p><div class="row spread"><strong style="font-size:36px;font-weight:450">${temp(room.values.at(-1))}</strong><span class="pill">${state.offline&&room.id==='bedroom'?'Last known · offline':'Observed at 18:00'}</span></div><p class="small" style="margin-top:20px">${state.offline&&room.id==='bedroom'?'Current state is unknown. The last reported reading remains visible.':'The latest sample observation is shown. Select a history range in the dashboard to explore changes.'}</p><div class="dialog-actions"><button class="btn primary" data-action="close-dialog">Back to dashboard</button></div>`);return}
      if(action==='load-saved'){const d=state.saved.find(x=>x.id===button.dataset.id);state.savedId=d.id;state.title=d.title;state.unit=d.unit;state.selected=[...d.rooms];state.view='temperature';renderMessages();showCanvas()}
      if(action==='delete-saved'){const d=state.saved.find(x=>x.id===button.dataset.id);openDialog(`<h2 id="dialog-title">Remove this saved view?</h2><p class="intro">${escapeHTML(d.title)} will be removed from this browser. Your home data is unaffected.</p><div class="dialog-actions"><button class="btn ghost" data-action="close-dialog">Keep view</button><button class="btn primary" data-action="confirm-delete" data-id="${escapeHTML(d.id)}">Remove view</button></div>`);return}
      if(action==='confirm-delete'){const next=state.saved.filter(d=>d.id!==button.dataset.id);try{localStorage.setItem(storageKey,JSON.stringify(next));state.saved=next;if(state.savedId===button.dataset.id)state.savedId=null;closeDialog();toast('Saved view removed.')}catch{toast('Browser storage is unavailable. The view was not removed.')}}
      if(action==='approve-automation'){const input=$('#threshold');if(!input.reportValidity())return;state.threshold=Number(input.value);openDialog(`<h2 id="dialog-title">Enable this automation?</h2><p class="intro">Review the exact proposal before Hearth executes it.</p><div class="code">WHEN Office temperature &gt; ${state.threshold}°C
THEN notify Household Discord
“The office is above ${state.threshold}°C.
It might be time to let some air in.”</div><p class="small">Each matching observation can send a notification. No cooldown is configured. This action is simulated in the prototype.</p><div class="dialog-actions"><button class="btn ghost" data-action="close-dialog">Keep editing</button><button class="btn primary" data-action="confirm-automation">Enable in demo</button></div>`);return}
      if(action==='confirm-automation'){state.automationStatus='enabled';closeDialog();addAssistant(`Your office alert is <strong>enabled in this demo</strong>. The simulated Core accepted the ${state.threshold}°C threshold and notification destination.`,null,{trace:'Definition validated · demo outcome retained in this session'});renderMessages();toast('Automation enabled in the demo.')}
      if(action==='disable-automation'){state.automationStatus='draft';state.run=false;renderMessages();toast('Demo automation disabled. You can edit it again.')}
      if(action==='simulate-run'){state.run=true;toast('Demo run completed. No real notification was sent.')}
      if(action==='power'){state.lightOn=!state.lightOn;state.receipt=`Simulated command satisfied · lamp reported ${state.lightOn?'on':'off'}.`}
      renderCanvas();
    });
    document.addEventListener('submit',(event)=>{event.preventDefault();const form=event.target;
      if(form.id==='composer'){request($('#prompt').value);return}
      if(form.id==='customize-form'){const data=new FormData(form),selected=data.getAll('rooms'),title=$('#view-title').value.trim();if(!title){$('#customize-error').textContent='Give this dashboard a name.';return}if(!selected.length){$('#customize-error').textContent='Choose at least one room.';return}state.title=title;state.selected=selected;state.unit=$('#unit').value;closeDialog();render();toast('View updated. Save it to keep these changes.');return}
      if(form.id==='save-form'){const title=$('#save-title').value.trim();if(!title){$('#save-error').textContent='Give this dashboard a name.';return}const id=state.savedId||'view-'+Date.now();const dashboard={id,title,unit:state.unit,rooms:[...state.selected]};const next=[...state.saved.filter(d=>d.id!==id),dashboard];try{localStorage.setItem(storageKey,JSON.stringify(next))}catch{$('#save-error').textContent='Browser storage is unavailable. Your view is still open; try saving again.';return}state.saved=next;state.savedId=id;state.title=title;closeDialog();render();toast('Dashboard saved. Find it in Dashboards.');}
    });
    $('#prompt').addEventListener('keydown',(event)=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('#composer').requestSubmit()}});
    document.addEventListener('input',(event)=>{if(event.target.id==='brightness'){$('#brightness-value').textContent=`${event.target.value}%`;$('.lamp').style.setProperty('--brightness',0.4+Number(event.target.value)/100)}});
    document.addEventListener('change',(event)=>{const el=event.target;if(el.id==='brightness'){state.brightness=Number(el.value);state.receipt=`Simulated command satisfied · brightness observed at ${state.brightness}%.`;renderCanvas()}if(el.id==='threshold'&&el.checkValidity()){state.threshold=Number(el.value);renderCanvas()}if(el.id==='offline'){state.offline=el.checked;toast(state.offline?'Bedroom will show an offline state.':'Bedroom sample sensor restored.')}if(el.id==='fail-next'){state.failNext=el.checked}});
    $('.avatar').setAttribute('role','img');
    render();
  </script>
</body>
</html>
