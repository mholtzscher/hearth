<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hearth · Feature walkthrough</title><style>
*{box-sizing:border-box}body{margin:0;background:#111416;color:#edece7;font:15px/1.6 ui-sans-serif,system-ui,sans-serif}main{max-width:1350px;margin:40px auto;padding:0 26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.eyebrow{font-size:11px;color:#edb38e;letter-spacing:2px}h1{font-size:30px;letter-spacing:-1px;font-weight:500;margin:5px 0}p{color:#a4acae;margin:0;font-size:13px}video{display:block;width:100%;border:1px solid #303639;border-radius:12px;background:#0b0e10}a{color:#edb38e}button{color:#edece7;background:#1b1f22;border:1px solid #303639;border-radius:8px;padding:12px;text-align:left;cursor:pointer;font:inherit;font-size:12px}button:hover{border-color:#edb38e}button span{color:#9dd9c7;margin-right:9px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}footer{color:#a4acae;font-size:12px;margin:20px 0}a:focus-visible,button:focus-visible{outline:2px solid #edb38e;outline-offset:3px}@media(max-width:700px){main{margin:20px auto;padding:0 15px}header{align-items:flex-start;flex-direction:column}h1{font-size:25px}nav{grid-template-columns:1fr 1fr}}
</style></head><body><main><header><div><div class="eyebrow">HEARTH · EXPERIENCE STUDY</div><h1>A home, in conversation.</h1><p>A complete feature walkthrough, from the first question to a saved dashboard.</p></div><a href="walkthrough.mp4" download="hearth-agent-walkthrough.mp4">Download MP4 ↓</a></header><video id="video" controls playsinline preload="metadata" poster="poster.jpg"><source src="walkthrough.mp4" type="video/mp4">Your browser does not support embedded video. Use the download link.</video><nav id="chapters" aria-label="Video chapters"></nav><footer>Silent walkthrough with on-screen chapter titles. All home data is illustrative and device actions are simulated.</footer></main><script>
fetch('chapters.json').then(r=>r.json()).then(data=>{const nav=document.getElementById('chapters');data.chapters.forEach((chapter,index)=>{const b=document.createElement('button'),time=document.createElement('span');time.textContent=Math.floor(chapter.start/60)+':'+String(Math.floor(chapter.start%60)).padStart(2,'0');b.append(time,document.createTextNode(chapter.title));b.onclick=()=>{const v=document.getElementById('video');v.currentTime=chapter.start;v.play()};nav.append(b)})});
</script></body></html>
