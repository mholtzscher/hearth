# Companion only: Core and NATS remain operator-managed on a trusted network.
services:
  discord:
    image: ghcr.io/mholtzscher/hearth/hearth-discord:latest
    command: ["--config", "/etc/hearth/discord.yaml"]
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./discord.yaml:/etc/hearth/discord.yaml:ro
    secrets:
      - discord-household-webhook
secrets:
  discord-household-webhook:
    file: ./secrets/discord-household-webhook
