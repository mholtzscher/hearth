# Never execute those transitive native build scripts during install or image build.
allowBuilds:
  '@serialport/bindings-cpp': false
  '@stoprocent/bluetooth-hci-socket': false
  '@stoprocent/noble': false
  usb: false
patchedDependencies:
  '@homebridge/hap-nodejs@2.2.3': patches/@homebridge__hap-nodejs@2.2.3.patch
