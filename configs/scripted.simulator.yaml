# One simulator process with independent Adapters for healthy coverage and faults.
# Each fault has its own Adapter so unhealthy health cannot mask other cases.
# Worktree-specific NATS and control addresses are CLI flags supplied by Mise.
adapters:
  - adapter_id: sim-healthy
    notifications:
      - {key: accepted, name: Simulated accepted notification, outcome: accepted}
      - {key: rejected, name: Simulated rejected notification, outcome: rejected, reason_code: provider_rejected}
      - {key: not-sent, name: Simulated not-sent notification, outcome: not_sent, reason_code: adapter_busy}
      - {key: unknown, name: Simulated unknown notification, outcome: unknown, reason_code: provider_error}
      - {key: held, name: Simulated held notification, outcome: accepted, hold: true}
    functions:
      - key: inspect
        description: Echo the invocation arguments as the successful result.
        input_schema: {type: object, additionalProperties: true}
        output_schema: {type: object, additionalProperties: true}
        echo_arguments: true
      - key: fail
        description: Return a failed terminal outcome.
        input_schema: {type: object}
        output_schema: {type: object}
        outcome: failed
        reason_code: simulated_failure
      - key: not-executed
        description: Return a not-executed terminal outcome.
        input_schema: {type: object}
        output_schema: {type: object}
        outcome: not_executed
        reason_code: simulated_unavailable
      - key: unknown
        description: Return an unknown terminal outcome.
        input_schema: {type: object}
        output_schema: {type: object}
        outcome: unknown
        reason_code: simulated_unknown
      - key: hold
        description: Stay running until released through the control channel.
        timeout_ms: 30000
        input_schema: {type: object}
        output_schema: {type: object}
        hold: true
    devices:
      - binding_key: simulated-air-purifier
        name: Simulated air purifier
        kind: air-purifier
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
            commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
          - key: display
            name: Display
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
            commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
          - key: child-lock
            name: Child lock
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: false
            commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
          - key: mode
            name: Mode
            type: hearth.enumsetting/v1
            support: {state: {choices: [manual, auto, sleep]}, operations: {set: {}}}
            initial: auto
            commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
          - key: fan-level
            name: Manual fan level
            type: hearth.enumsetting/v1
            support: {state: {choices: ["1", "2", "3", "4"]}, operations: {set: {}}}
            initial: "2"
            commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
          - key: pm25
            name: PM2.5
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 1000, unit: "µg/m³", quantity_kind: particulate_matter}, operations: {}}
            initial: 6
            outputs: {interval: 20s, values: [6, 7, 12, 38, 9]}
          - key: filter-life
            name: Filter life
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 100, unit: "%"}, operations: {}}
            initial: 82
      - binding_key: simulated-light
        name: Simulated light
        kind: light
        health: healthy
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
            # First value publishes at startup, then one entry per interval, looping.
            outputs: {interval: 5s, values: [true, false]}
            commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
          - key: temperature
