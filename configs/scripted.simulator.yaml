            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 120000, unit: lx}, operations: {}}
            initial: 0
            outputs: {interval: 15s, values: [0, 100, 10000, 100000, 10000]}

      # Capability subsets keep simple lights distinct from the all-types fixture.
      # No power/brightness ticker: a set Command stays visible until the next set.
      - binding_key: hallway-light
        name: Hallway light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: false

      - binding_key: bedside-light
        name: Bedside light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
          - key: brightness
            name: Brightness
            type: hearth.brightness/v1
            support: {state: {}, operations: {set: {}}}
            initial: 0

      - binding_key: kitchen-white-light
        name: Kitchen tunable white light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
          - key: brightness
            name: Brightness
            type: hearth.brightness/v1
            support: {state: {}, operations: {set: {}}}
            initial: 100
          - key: colortemp
            name: Color temperature
            type: hearth.colortemp/v1
            support: {state: {minimum: 153, maximum: 500}, operations: {set: {step: 1}}}
            initial: {active: true, value: 370}

      - binding_key: living-room-color-light
        name: Living room color light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
          - key: brightness
            name: Brightness
            type: hearth.brightness/v1
            support: {state: {}, operations: {set: {}}}
            initial: 60
          - key: colorhs
            name: Color HS
            type: hearth.colorhs/v1
            support: {state: {}, operations: {set: {}}}
            initial: {active: true, hue: 359, saturation: 100}
            outputs: {interval: 15s, values: [{active: true, hue: 359, saturation: 100}, {active: false, hue: 0, saturation: 0}]}
            # Coordinate Commands need full-State control publishes; generic application handles value only.
            commands: {set: {behavior: accept-and-publish, apply_parameters: false}}
          - key: colortemp
            name: Color temperature
            type: hearth.colortemp/v1
            support: {state: {minimum: 153, maximum: 500}, operations: {set: {step: 1}}}
            initial: {active: true, value: 153}
          - key: colormode
            name: Color mode
            type: hearth.colormode/v1
            support: {state: {}, operations: {}}
            initial: hs
            outputs: {interval: 15s, values: [hs, color_temp]}

      # Deliberate numeric edge cases, rather than realistic household readings.
      - binding_key: diagnostic-patterns
        name: Dashboard diagnostic patterns
        kind: sensor
        entities:
          - key: constant
            name: Constant value, reported once
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 100, unit: "1"}, operations: {}}
            initial: 42
          - key: repeated
            name: Repeated identical value
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 100, unit: "1"}, operations: {}}
            initial: 42
            outputs: {interval: 5s, values: [42, 42]}
          - key: rounded
            name: Changes below display precision
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 100, unit: "1"}, operations: {}}
            initial: 21.501
            outputs: {interval: 5s, values: [21.501, 21.502, 21.503]}
          - key: slow
            name: Slow ramp
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 100, unit: "%"}, operations: {}}
            initial: 0
            outputs: {interval: 2m, values: [0, 25, 50, 75, 100]}
          - key: rapid
            name: Rapid step changes
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 100, unit: "%"}, operations: {}}
            initial: 0
            outputs: {interval: 2s, values: [0, 0, 100, 100, 0]}

      - binding_key: diagnostic-ranges
        name: Dashboard diagnostic ranges
        kind: sensor
        entities:
          - key: zero
            name: Zero value
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 100, unit: "1"}, operations: {}}
            initial: 0
          - key: signed
            name: Negative and positive values
            type: hearth.numericsensor/v1
            support: {state: {minimum: -100, maximum: 100, unit: W}, operations: {}}
            initial: -100
            outputs: {interval: 5s, values: [-100, -0.5, 0, 0.5, 100]}
          - key: tiny
            name: Tiny decimal values
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 1, unit: A}, operations: {}}
            initial: 0.001
            outputs: {interval: 7s, values: [0.001, 0.002, 0.009, 0.1]}
          - key: large
            name: Large total
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 1000000000, unit: "W.h"}, operations: {}}
            initial: 987654321.5
          - key: spike
            name: Short spike
            type: hearth.numericsensor/v1
            support: {state: {minimum: 0, maximum: 1000, unit: W}, operations: {}}
            initial: 10
            outputs: {interval: 5s, values: [10, 10, 10, 1000, 10, 10]}

  - adapter_id: sim-unhealthy
    devices:
      - binding_key: simulated-unhealthy-sensor
        name: Simulated unhealthy sensor
        kind: sensor
        health: "unhealthy:hearth.external_system_unavailable"
        omit_availability_when_unhealthy: true
        entities:
          - key: temperature
            name: Temperature
            type: hearth.temperature/v1
            support: {state: {}, operations: {}}
            initial: 20000
            source_time_offset: -24h
            received_time_offset: +2m

  - adapter_id: sim-rejecting
    devices:
      - binding_key: simulated-rejecting-plug
        name: Simulated rejecting plug
        kind: relay
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
            outputs: {interval: 5s, values: [true]}
            commands: {set: {behavior: reject, reason: simulated upstream rejection}}

      # A light composite whose controls always fail, for dashboard control checks.
      - binding_key: simulated-rejecting-light
        name: Simulated rejecting light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: false
            commands: {set: {behavior: reject, reason: simulated upstream rejection}}
          - key: brightness
            name: Brightness
            type: hearth.brightness/v1
            support: {state: {}, operations: {set: {}}}
            initial: 40
            commands: {set: {behavior: reject, reason: simulated upstream rejection}}

  - adapter_id: sim-timeout
    devices:
      - binding_key: simulated-timeout-plug
        name: Simulated timeout plug
        kind: relay
        entities:
          - key: countdown
            name: Countdown
            type: hearth.numericsetting/v1
            support: {state: {minimum: 142, maximum: 454, unit: mired, choices: [previous]}, operations: {set: {}}}
            initial: {mode: value, value: 250}
            commands: {set: {behavior: accept-no-publish}}

      # A light composite whose controls never see a matching observation.
      - binding_key: simulated-timeout-light
        name: Simulated timeout light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: false
            commands: {set: {behavior: accept-no-publish}}
          - key: brightness
            name: Brightness
            type: hearth.brightness/v1
            support: {state: {}, operations: {set: {}}}
            initial: 40
            commands: {set: {behavior: accept-no-publish}}

  - adapter_id: sim-unavailable
    devices:
      - binding_key: simulated-unavailable-light
        name: Simulated unavailable light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
            available: false
            availability_reason: adapter.simulated-unavailable-light.measurement_stale
            commands: {set: {behavior: accept-and-publish, apply_parameters: true, mark_available: true}}
          - key: temperature
            name: Unavailable light temperature
            type: hearth.temperature/v1
            support: {state: {}, operations: {}}
            initial: 35000
            available: false
            availability_reason: adapter.simulated-unavailable-light.measurement_stale
