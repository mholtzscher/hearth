                - {starts_at: "2099-01-01T00:00:00Z", condition: clear-night, temperature: 2.5, precipitation_probability: 0}
                - {starts_at: "2099-01-01T01:00:00Z", condition: partly-cloudy-night, temperature: 2.1, precipitation_probability: 5}
                - {starts_at: "2099-01-01T02:00:00Z", condition: cloudy, temperature: 1.8, precipitation_probability: 20}
                - {starts_at: "2099-01-01T03:00:00Z", condition: rain, temperature: 1.6, precipitation_probability: 70}
                - {starts_at: "2099-01-01T04:00:00Z", condition: sleet, temperature: 0.4, precipitation_probability: 80}
                - {starts_at: "2099-01-01T05:00:00Z", condition: snow, temperature: -0.6, precipitation_probability: 60}
          - key: daily-forecast
            name: Daily forecast
            type: hearth.dailyforecast/v1
            support: {state: {}, operations: {}}
            initial:
              periods:
                - {starts_at: "2099-01-01T06:00:00Z", date: "2099-01-01", condition: rain, temperature_min: -0.6, temperature_max: 4.2, precipitation_probability: 80}
                - {starts_at: "2099-01-02T06:00:00Z", date: "2099-01-02", condition: partly-cloudy-day, temperature_min: -3.1, temperature_max: 2.0, precipitation_probability: 10}
