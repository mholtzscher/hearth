# Mosquitto configuration for the local Compose stack (compose.yaml).
#
# Plain TCP on 1883 with anonymous access matches the Zigbee2MQTT v1 loopback
# boundary. The host publishes only 127.0.0.1 (see compose.yaml); never expose
# this listener to an untrusted network.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
