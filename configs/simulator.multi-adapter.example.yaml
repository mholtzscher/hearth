# One simulator process with independently healthy and faulted Adapters.
# Start directly with: mise exec -- go run ./cmd/hearth-simulator -config configs/simulator.multi-adapter.example.yaml
# For the full Entity catalogue, extend simulator-healthy using the Devices
# in simulator.full.example.yaml (without its demo-broken Device).
nats_url: nats://127.0.0.1:4222
control_addr: 127.0.0.1:8181
adapters:
  - adapter_id: simulator-healthy
    devices:
      - binding_key: light
        name: Healthy light
        kind: light
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: false
            commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
      - binding_key: button
        name: Healthy button
        kind: sensor
        entities:
          - key: events
            name: Events
            type: hearth.enumevent/v1
            support: {state: {}, operations: {}, events: {names: [single_press]}}
            outputs: {interval: 30s, values: [single_press]}

  - adapter_id: simulator-unhealthy
    devices:
      - binding_key: sensor
        name: Broken sensor
        kind: sensor
        health: "unhealthy:hearth.external_system_unavailable"
        omit_availability_when_unhealthy: true
        entities:
          - key: temperature
            name: Temperature
            type: hearth.temperature/v1
            support: {state: {unit: mCel}, operations: {}}
            initial: 20000

  - adapter_id: simulator-command-faults
    devices:
      - binding_key: plug
        name: Faulty plug
        kind: relay
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: true
            commands: {set: {behavior: reject, reason: simulated upstream rejection}}
          - key: fallback
            name: Fallback power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            initial: false
            commands: {set: {behavior: accept-no-publish}}
