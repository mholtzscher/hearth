# For manual deployment, replace nats_url with your operator-managed NATS endpoint.
# The simulator stack supplies its own worktree-specific address by CLI flag.
http_addr: 127.0.0.1:8080
nats_url: nats://127.0.0.1:4222
sqlite_path: .data/hearthd.db
# Observation retention window (default 30d, minimum 8d). Applies on the startup prune pass.
observation_retention: 720h
# Automation history retention window for terminal Runs and Skips (default 30d, minimum 8d).
# Applies on the startup prune pass; matched Device Fact receipts are retained.
automation_history_retention: 720h

# The household agent is a required Core module: Core always constructs it, so
# api_key_file must name an existing local secret file. The key is read once at
# startup and never logged, persisted, or echoed in diagnostics.
agent:
  api_key_file: .data/agent-api-key
  # Chat model name (default gpt-5.6-luna).
  model: gpt-5.6-luna
  # Provider endpoint override; empty uses the provider default. Absolute http or https only.
  base_url: ""
  # Reasoning level: none, minimal, low, medium, or high; empty selects the provider default,
  # except for the default model where it selects none. The default model rejects function
  # tools at any other level.
  reasoning_effort: none
  # Bounds one turn's model plus tools steps (default 20).
  max_steps: 20
  # Conversation retention window (default 30d, minimum 24h). Applies on the startup prune pass.
  history_retention: 720h

# IANA timezone; required, changes take effect after restart.
household_timezone: UTC
