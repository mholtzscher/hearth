# NATS configuration mounted into the local Compose stack (compose.yaml).
#
# The container binds all interfaces so Compose can publish its ports; the host
# publishes only 127.0.0.1 (see compose.yaml). MQTT is not a NATS listener:
# Mosquitto owns MQTT 1883.
listen: 0.0.0.0:4222
jetstream {
  store_dir: "/data/nats"
}
# Browser dashboard (dev only, loopback): live NATS viewer over websocket,
# server introspection over HTTP monitoring (proxied by vite, same-origin).
websocket {
  listen: 0.0.0.0:4223
  no_tls: true
}
http: 0.0.0.0:8222
