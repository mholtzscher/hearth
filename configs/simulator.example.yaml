# First-light simulator config: one Adapter with one scripted power Device. Copy to
# configs/simulator.yaml (gitignored) and run:
#   go run ./cmd/hearth-simulator -config configs/simulator.yaml
#
# Every Device and Entity is declared under an Adapter; see
# specs/simulator-harness.md for the full YAML surface and
# configs/simulator.scripted.example.yaml for the full validation inventory.
nats_url: nats://127.0.0.1:4222
adapters:
  - adapter_id: simulator
    devices:
      - binding_key: simulated-light
        name: Simulated light
        kind: light
        health: healthy
        entities:
          - key: power
            name: Power
            type: hearth.power/v1
            support: {state: {}, operations: {set: {}}}
            # false is the initial State; it publishes once at startup.
            initial: false
            commands: {set: {behavior: accept-and-publish}}
