# Scripted simulator harness: declare Devices in YAML, launch the simulator,
# then interact through hearthd (State, Commands, Device Facts) and through the
# loopback control channel (publish now, pause/resume scripts).
#
# Either `scenario:` (legacy failure matrix) or `devices:` (this file) is
# required; the two are mutually exclusive.
adapter_id: simulator
nats_url: nats://127.0.0.1:4222
# Optional agent control channel. Loopback only; omit to disable.
control_addr: 127.0.0.1:8181
devices:
  - binding_key: simulated-light
    name: Simulated light
    kind: light
    health: healthy
    entities:
      - key: power
        name: Power
        type: hearth.power/v1
        support: {state: {}, operations: {set: {}}}
        initial: true
        # First value publishes at startup, then one entry per interval, looping.
        outputs: {interval: 5s, values: [true, false]}
        commands: {set: {behavior: accept-and-publish, apply_parameters: true}}
      - key: temperature
        name: Temperature
        type: hearth.temperature/v1
        support: {state: {unit: mCel}, operations: {}}
        initial: 21500
        outputs: {interval: 10s, values: [21500, 21600, 21400]}
  - binding_key: simulated-button
    name: Simulated button
    kind: sensor
    entities:
      - key: events
        name: Events
        type: hearth.enumevent/v1
        support: {state: {}, operations: {}, events: {names: [single_press, double_press]}}
        outputs: {interval: 30s, values: [single_press, double_press]}

# Command behaviors per operation: accept-and-publish (default, with
# apply_parameters: true), accept-no-publish (accepted, no outcome Observation,
# so the Command times out), or reject (with optional reason).
#
# Control channel (when enabled):
#   GET  /v1/sim/entities                        # canonical IDs, types, current values
#   POST /v1/sim/entities/{id}/publish {"value": <json>}   # State Entities
#   POST /v1/sim/entities/{id}/publish {"name": "<event>"} # event sources
#   POST /v1/sim/entities/{id}/pause
#   POST /v1/sim/entities/{id}/resume
#
# Agent recipe: pause an Entity's script for stable State, send Commands
# through hearthd, assert outcomes, then resume the script.
