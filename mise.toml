#:schema https://mise.jdx.dev/schema/mise.json

[tools]
python = "3.14"
go = "1.27.1"
node = "26.6.0"
pnpm = "latest"
golangci-lint = "latest"
"aqua:pressly/goose" = "3.27.3"
"github:nats-io/nats-server" = "2.12"
ko = "latest"
sqlc = "latest"
"github:go-gremlins/gremlins" = "0.6.0"
"npm:mqtt" = "5.15.2"

[tasks."generate"]
description = "Regenerate checked-in code"
run = '''
go generate ./entitytypes
sqlc generate
'''

[tasks."format"]
description = "Format Go files"
shell = "bash -e -o pipefail -c"
depends = ["generate"]
run = '''
git ls-files -z --cached --others --exclude-standard -- '*.go' |
  xargs -0 -r sh -c 'for file do test -f "$file" && gofmt -w "$file"; done' _
'''

[tasks."format-check"]
description = "Check Go formatting"
shell = "bash -e -o pipefail -c"
depends = ["tidy"]
run = '''
unformatted="$(
  git ls-files -z --cached --others --exclude-standard -- '*.go' |
    xargs -0 -r sh -c 'for file do test -f "$file" && gofmt -l "$file"; done' _
)"
if test -n "$unformatted"; then
  printf 'The following Go files need formatting:\n%s\n' "$unformatted"
  exit 1
fi
'''

[tasks."tidy"]
description = "Tidy module metadata"
depends = ["format"]
run = '''go mod tidy'''

[tasks."tidy-check"]
description = "Check module tidiness"
depends = ["tidy"]
run = '''go mod tidy -diff'''

[tasks."generate-check"]
description = "Check generated code"
depends = ["tidy"]
run = '''
go run ./internal/cmd/entitytypegen -root . -check

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
mkdir -p "$tmp/internal/platform/db" "$tmp/internal/modules/devices/sqlite" "$tmp/internal/modules/automations/sqlite"
cp sqlc.yaml "$tmp/"
cp -R internal/platform/db/migrations "$tmp/internal/platform/db/"
cp -R internal/modules/devices/sqlite/dbqueries internal/modules/devices/sqlite/dbsqlc "$tmp/internal/modules/devices/sqlite/"
cp -R internal/modules/automations/sqlite/dbqueries internal/modules/automations/sqlite/dbsqlc "$tmp/internal/modules/automations/sqlite/"
(cd "$tmp" && sqlc generate)
diff -ru internal/modules/devices/sqlite/dbsqlc "$tmp/internal/modules/devices/sqlite/dbsqlc"
diff -ru internal/modules/automations/sqlite/dbsqlc "$tmp/internal/modules/automations/sqlite/dbsqlc"
'''

[tasks."ko-build"]
description = "Build container images locally"
depends = ["tidy"]
run = '''
KO_DOCKER_REPO=example.invalid/hearth ko build --base-import-paths --tags validation --push=false \
  ./cmd/hearthd ./cmd/hearth-adapter-homeassistant ./cmd/hearth-adapter-zigbee2mqtt \
  ./cmd/hearth-adapter-ecowitt ./cmd/hearth-simulator
'''

[tasks."web-docker-build"]
description = "Build the dashboard container image locally"
run = '''docker build ./web --tag hearth-web:dev'''

[tasks."update-lint-config"]
description = "Update .golangci.yml to match the installed golangci-lint version"
run = '''
version="$(mise current golangci-lint)"
url="https://raw.githubusercontent.com/maratori/golangci-lint-config/v${version}/.golangci.yml"
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT

curl --fail --silent --show-error --location "$url" --output "$tmp"
if ! grep -q -- '- github.com/my/project' "$tmp"; then
  echo "Upstream config no longer contains the expected module placeholder" >&2
  exit 1
fi
sed 's|github.com/my/project|github.com/mholtzscher/hearth|' "$tmp" > .golangci.yml
'''

[tasks."lint"]
description = "Lint"
depends = ["tidy"]
run = '''golangci-lint run ./...'''

[tasks."test"]
description = "Test with the race detector against a real Mosquitto broker"
depends = ["tidy"]
# Bound package parallelism so race-enabled timing tests remain stable on
# high-core development hosts while disposable broker containers start.
run = '''HEARTH_REQUIRE_MOSQUITTO=1 go test -race -count=1 -p 4 ./...'''

[tasks."test-brokers"]
description = "Run the real-Mosquitto integration tests with the race detector"
run = '''HEARTH_REQUIRE_MOSQUITTO=1 go test -race -count=1 ./internal/adapters/zigbee2mqtt ./internal/app/zigbee2mqtt ./internal/adapters/ecowitt ./internal/app/ecowitt'''

[tasks."fuzz-entitytypes-json-codec"]
description = "Run a bounded JSONCodec fuzz campaign"
run = '''go test ./entitytypes -run='^$' -fuzz='^FuzzJSONCodecDecodeStability$' -fuzztime="${FUZZTIME:-5s}"'''

[tasks."fuzz-natswire-codec"]
description = "Run a bounded NATS wire codec fuzz campaign"
run = '''go test ./internal/contracts/v1/natswire -run='^$' -fuzz='^FuzzCodecObservationRoundTrip$' -fuzztime="${FUZZTIME:-5s}"'''

[tasks."fuzz-natswire-subjects"]
description = "Run a bounded NATS subject parser fuzz campaign"
run = '''go test ./internal/contracts/v1/natswire -run='^$' -fuzz='^FuzzSubjectParsersCanonicalRoundTrip$' -fuzztime="${FUZZTIME:-5s}"'''

[tasks."fuzz-zigbee2mqtt-discovery"]
description = "Run a bounded Zigbee2MQTT inventory fuzz campaign"
run = '''go test ./internal/adapters/zigbee2mqtt -run='^$' -fuzz='^FuzzDiscoverInventory$' -fuzztime="${FUZZTIME:-5s}"'''

[tasks."fuzz-zigbee2mqtt-state"]
description = "Run a bounded Zigbee2MQTT State fuzz campaign"
run = '''go test ./internal/adapters/zigbee2mqtt -run='^$' -fuzz='^FuzzDeviceState$' -fuzztime="${FUZZTIME:-5s}"'''

[tasks."fuzz-ecowitt-report"]
description = "Run a bounded Ecowitt report parser fuzz campaign"
run = '''go test ./internal/adapters/ecowitt -run='^$' -fuzz='^FuzzParseStationReport$' -fuzztime="${FUZZTIME:-5s}"'''

[tasks."fuzz-ecowitt-projection"]
description = "Run a bounded Ecowitt Observation projection fuzz campaign"
run = '''go test ./internal/adapters/ecowitt -run='^$' -fuzz='^FuzzProjectReport$' -fuzztime="${FUZZTIME:-5s}"'''

[tasks."fuzz"]
description = "Run all bounded fuzz campaigns"
run = '''
mise run fuzz-natswire-subjects
mise run fuzz-entitytypes-json-codec
mise run fuzz-natswire-codec
mise run fuzz-zigbee2mqtt-discovery
mise run fuzz-zigbee2mqtt-state
mise run fuzz-ecowitt-report
mise run fuzz-ecowitt-projection
'''

[tasks."test-entitytype-fixtures"]
description = "Compile and execute generated entity-type fixtures in an isolated module"
depends = ["tidy"]
run = '''HEARTH_FIXTURE_EXEC=1 go test ./internal/cmd/entitytypegen -run='^TestFixtureExecution$' -count=1 -v'''

[tasks."vet"]
description = "Vet"
depends = ["tidy"]
run = '''go vet ./...'''

[tasks."brokers"]
description = "Start local NATS and Mosquitto brokers with Docker Compose (data in .data)"
run = '''docker compose up'''

[tasks."brokers-down"]
description = "Stop local NATS and Mosquitto brokers and remove their containers"
run = '''docker compose down'''

[tasks."broker-images-pull"]
description = "Pre-pull the pinned Mosquitto image used by tests and the local stack"
run = '''docker pull eclipse-mosquitto:2.0.22'''

[tasks."simulator-start"]
description = "Start an isolated NATS-only simulator stack in Herdr (optional --devices PATH or --preset full, --dashboard)"
run = '''python3 -B .agents/skills/simulator-validation/scripts/start.py'''

[tasks."simulator-smoke"]
description = "Assert default running simulator Command, State, and Entity Event behavior; save Core evidence"
run = '''python3 -B .agents/skills/simulator-validation/scripts/smoke.py'''

[tasks."simulator-stop"]
description = "Close this worktree's owned simulator validation tab, preserving configs and data"
run = '''python3 -B .agents/skills/simulator-validation/scripts/stop.py'''

[tasks."simulator-start-test"]
description = "Test simulator lifecycle safety with mocked local services"
run = '''python3 -B -m unittest discover -s .agents/skills/simulator-validation/scripts -p 'test_*.py' -v'''

[tasks."real-device-start"]
description = "Start local validation against shared homelab NATS and Zigbee2MQTT, published to the tailnet"
usage = 'arg "<host>" help="Homelab hostname (for example wanda)"'
run = '''python3 -B .agents/skills/real-device-validation/scripts/start.py "$usage_host"'''

[tasks."real-device-stop"]
description = "Close this worktree's recorded real-device validation tab and tailnet route"
run = '''python3 -B .agents/skills/real-device-validation/scripts/stop.py'''

[tasks."real-device-start-test"]
description = "Test real-device lifecycle safety with mocked services (no homelab access)"
run = '''python3 -B -m unittest discover -s .agents/skills/real-device-validation/scripts -p 'test_*.py' -v'''

[tasks."web-install"]
description = "Install dashboard dependencies"
run = '''pnpm --dir web install'''

[tasks."web-build"]
description = "Typecheck and build the dashboard"
depends = ["web-install"]
run = '''pnpm --dir web run build'''

[tasks."web-test"]
description = "Run the dashboard frontend tests (Vitest + jsdom)"
depends = ["web-install"]
run = '''pnpm --dir web run test'''

[tasks."web-dev"]
description = "Run the dashboard dev server (proxies hearthd on 127.0.0.1:8080; run web-install first)"
run = '''pnpm --dir web run dev --host 127.0.0.1 --strictPort'''

[tasks."web-dev-remote"]
description = "Run the dashboard dev server against a remote hearthd (override with HEARTHD_URL and NATS_MONITOR_URL)"
run = '''HEARTHD_URL="${HEARTHD_URL:-http://wanda:8081}" NATS_MONITOR_URL="${NATS_MONITOR_URL:-http://wanda:8222}" pnpm --dir web run dev'''

[tasks."mutation-test"]
description = "Run Gremlins mutation testing (pass package paths after --)"
run = '''gremlins unleash'''

[tasks."validate"]
description = "Run all validation"
depends = [
  "format-check",
  "generate-check",
  "real-device-start-test",
  "simulator-start-test",
  "lint",
  "tidy-check",
  "test",
  "test-entitytype-fixtures",
  "web-test",
  "vet",
]
