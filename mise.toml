#:schema https://mise.jdx.dev/schema/mise.json

[tools]
pitchfork = "2.25.0"
python = "3.14"
go = "1.27.1"
node = "26.6.0"
pnpm = "latest"
golangci-lint = "latest"
"aqua:pressly/goose" = "3.27.3"
"github:nats-io/nats-server" = "2.12"
ko = "latest"
sqlc = "latest"
"npm:mqtt" = "5.15.2"

[settings]
experimental = true

# `mise daemons start` defaults to the simulator stack.
[daemon_groups]
default = ["simulator-stack"]
simulator-stack = ["sim-nats", "sim-core", "simulator", "sim-web"]

[daemons.sim-nats]
run = "SIM_NATS_LISTEN=127.0.0.1:$SIM_NATS_PORT SIM_NATS_STORE=$PWD/.data/simulator-stack/storage/nats SIM_NATS_WS_LISTEN=127.0.0.1:$(($SIM_NATS_PORT + 1)) SIM_NATS_MONITOR_LISTEN=127.0.0.1:$(($SIM_NATS_PORT + 4000)) exec nats-server -c configs/nats.simulator.conf"
port = { auto = true, base = 4222, stride = 10 }
proxy = false
ready_cmd = "curl -fsS http://127.0.0.1:$(($PORT + 4000))/healthz?js-enabled-only=true"

[daemons.sim-core]
run = "exec go run ./cmd/hearthd --config configs/hearthd.simulator.yaml --http-addr 127.0.0.1:$SIM_CORE_PORT --nats-url nats://127.0.0.1:$SIM_NATS_PORT --sqlite-path .data/simulator-stack/storage/hearthd.db --agent-api-key-file $HOME/.local/share/agenix/hearth-openai-api-key"
port = { auto = true, base = 8080, stride = 10 }
proxy = false
depends = ["sim-nats"]
ready_cmd = "curl -fsS http://127.0.0.1:$PORT/readyz"

[daemons.simulator]
run = "exec go run ./cmd/hearth-simulator -config configs/scripted.simulator.yaml -nats-url nats://127.0.0.1:$SIM_NATS_PORT -control-addr 127.0.0.1:$SIMULATOR_PORT"
port = { auto = true, base = 8181, stride = 10 }
proxy = false
depends = ["sim-core"]
# Multi-Adapter control starts only after every Session has registered and initialized.
ready_cmd = "curl -fsS http://127.0.0.1:$PORT/v1/sim/entities >/dev/null"

[daemons.sim-web]
run = "HEARTHD_URL=http://127.0.0.1:$SIM_CORE_PORT NATS_MONITOR_URL=http://127.0.0.1:$(($SIM_NATS_PORT + 4000)) VITE_NATS_WS_URL=ws://127.0.0.1:$(($SIM_NATS_PORT + 1)) HEARTH_WEB_PORT=$SIM_WEB_PORT exec pnpm --dir web run dev --host 127.0.0.1 --strictPort"
port = { auto = true, base = 5173, stride = 10 }
proxy = false
depends = ["simulator"]
ready_cmd = "curl -fsS http://127.0.0.1:$PORT/ >/dev/null && curl -fsS http://127.0.0.1:$PORT/readyz >/dev/null && curl -fsS http://127.0.0.1:$PORT/nats-monitor/varz >/dev/null"

[daemons.zwave-adapter]
run = "mkdir -p .data/simulator-stack && sed 's|^nats_url:.*$|nats_url: nats://127.0.0.1:'\"$SIM_NATS_PORT\"'|' configs/zwavejs.yaml > .data/simulator-stack/zwavejs.yaml && exec go run ./cmd/hearth-adapter-zwavejs -config .data/simulator-stack/zwavejs.yaml"
depends = ["sim-core"]
ready_cmd = "bash cmd/hearth-adapter-zwavejs/ready.sh"

[tasks."simulator-start"]
description = "Start worktree-local NATS, Core, the multi-Adapter simulator, and dashboard"
run = '''
agent_api_key_file="$HOME/.local/share/agenix/hearth-openai-api-key"
if [ ! -f "$agent_api_key_file" ] || [ ! -r "$agent_api_key_file" ] || ! grep -q '[^[:space:]]' "$agent_api_key_file" 2>/dev/null; then
  printf '%s\n' "simulator-start: a readable, nonempty agent key file is required at $agent_api_key_file" >&2
  exit 1
fi
mkdir -p .data/simulator-stack/storage
if [ ! -d web/node_modules ]; then mise run web-install; fi
mise daemons start simulator-stack
'''

[tasks."simulator-stop"]
description = "Stop this worktree's simulator daemons without deleting evidence"
run = '''mise daemons stop sim-web simulator sim-core sim-nats'''

[tasks."zwave-start"]
description = "Start the optional Z-Wave JS adapter alongside the simulator stack"
run = '''
if [ ! -f configs/zwavejs.yaml ] || ! grep -q '^nats_url:' configs/zwavejs.yaml; then
  printf '%s\n' 'zwave-start: copy configs/zwavejs.example.yaml to configs/zwavejs.yaml and set zwave_js.url' >&2
  exit 1
fi
mise run simulator-start
mise daemons start zwave-adapter
'''

[tasks."zwave-stop"]
description = "Stop the optional Z-Wave JS adapter without stopping the simulator stack"
run = '''mise daemons stop zwave-adapter'''

[tasks."generate"]
description = "Regenerate checked-in code"
run = '''
go generate ./entitytypes
sqlc generate
'''

[tasks."format"]
description = "Format Go files"
depends = ["generate"]
run = '''golangci-lint fmt'''

[tasks."tidy"]
description = "Tidy module metadata"
depends = ["format"]
run = '''go mod tidy'''

[tasks."ko-build"]
description = "Build container images locally"
depends = ["tidy"]
run = '''
KO_DOCKER_REPO=example.invalid/hearth ko build --base-import-paths --tags validation --push=false \
  ./cmd/hearthd ./cmd/hearth-adapter-zigbee2mqtt \
  ./cmd/hearth-adapter-ecowitt ./cmd/hearth-adapter-zwavejs ./cmd/hearth-simulator ./cmd/hearth-adapter-discord
'''

[tasks."web-docker-build"]
description = "Build the dashboard container image locally"
run = '''docker build ./web --tag hearth-web:dev'''

[tasks."lint"]
description = "Lint (GO_PACKAGES selects space-separated packages; defaults to ./...)"
depends = ["tidy"]
run = '''
set -ef
go run ./internal/cmd/testboundarylint
golangci-lint run --build-tags=integration,e2e ${GO_PACKAGES:-./...}
'''

[tasks."test"]
description = "Test (local units; all levels with race in CI; GO_PACKAGES selects packages, defaults to ./...)"
# Standalone tests skip preparation; validation schedules tidy through its other checks.
wait_for = ["tidy"]
# Remove the race detector's one-second exit sleep from each test binary.
run = '''
set -f
race=false
tags=
if [ "${CI:-}" = "true" ]; then race=true; tags=integration,e2e; fi
GORACE="${GORACE:-} atexit_sleep_ms=0" go test -race="$race" -tags="$tags" ${GO_PACKAGES:-./...}
'''

[tasks."test-profile"]
description = "Profile one Go test package (TEST_PACKAGE and PROFILE_DIR override defaults)"
wait_for = ["tidy"]
run = '''
set -eu
profile_dir="${PROFILE_DIR:-$PWD/.data/test-profile}"
mkdir -p "$profile_dir"
GORACE="${GORACE:-} atexit_sleep_ms=0" go test -race -tags=integration,e2e -count=1 -json \
  -o "$profile_dir/tests.test" -cpuprofile "$profile_dir/cpu.pprof" \
  -trace "$profile_dir/trace.out" \
  "${TEST_PACKAGE:-./internal/app/hearthd}" > "$profile_dir/tests.jsonl"
# Embedded NATS resets the runtime block-profile rate; derive waits from the trace instead.
go tool trace -pprof=sync "$profile_dir/trace.out" > "$profile_dir/block.pprof"
go tool pprof -top -nodecount=20 "$profile_dir/tests.test" "$profile_dir/cpu.pprof"
'''

[tasks."vet"]
description = "Vet (GO_PACKAGES selects space-separated packages; defaults to ./...)"
depends = ["tidy"]
run = '''set -f; go vet -tags=integration,e2e ${GO_PACKAGES:-./...}'''

[tasks."web-install"]
description = "Install dashboard dependencies"
run = '''pnpm --dir web install'''

[tasks."web-build"]
description = "Typecheck and build the dashboard"
depends = ["web-install"]
run = '''pnpm --dir web run build'''

[tasks."web-test"]
description = "Run the dashboard frontend tests (Vitest + jsdom)"
depends = ["web-install"]
run = '''pnpm --dir web run test'''

[tasks."web-dev"]
description = "Run the dashboard dev server (proxies hearthd on 127.0.0.1:8080; run web-install first)"
run = '''pnpm --dir web run dev --host 127.0.0.1 --strictPort'''

[tasks."web-dev-remote"]
description = "Run the dashboard dev server against a remote hearthd (override with HEARTHD_URL and NATS_MONITOR_URL)"
run = '''HEARTHD_URL="${HEARTHD_URL:-http://wanda:8081}" NATS_MONITOR_URL="${NATS_MONITOR_URL:-http://wanda:8222}" pnpm --dir web run dev'''

[tasks."validate-backend"]
description = "Run Go and validation-script checks"
depends = [
  "lint",
  { task = "test", args = ["-tags=integration,e2e"] },
  "vet",
]

[tasks."validate"]
description = "Run all validation"
depends = ["validate-backend", "web-test", "web-build"]
