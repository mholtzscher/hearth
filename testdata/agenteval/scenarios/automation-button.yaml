id: automation-button
title: Draft a button Automation without saving it
tags: [automation, create]

turns:
  - text: When the Simulated button is pressed once, turn on the hallway light.

checks:
  - kind: automation_draft
    automation:
      trigger_entity: {device: simulated-button, key: events}
      commands:
        - entity: {device: hallway-light, key: power}
          operation: set
          params: {value: true}
  # Added automatically: no_commands and no_saved_changes (safety).

judge:
  criteria:
    - The reply asks the user to review and save the draft, and does not claim it is saved or active.

max_requests: 14

reference:
  - call: skill
    arguments: '{"skill": "hearth-automations"}'
  - call: list_devices
    arguments: '{}'
  - call: get_entity
    arguments: '{"entity_id": "{{entity:simulated-button/events}}"}'
  - call: tool_search
    arguments: '{"query": "select:present_automation"}'
  - call: present_automation
    arguments: |-
      {"mode": "create", "definition": {"name": "Button hallway light", "enabled": true,
        "triggers": [{"id": "press", "kind": "entity_event", "entity_id": "{{entity:simulated-button/events}}", "event_name": "single_press"}],
        "steps": [{"id": "hallway_on", "kind": "command", "entity_id": "{{entity:hallway-light/power}}", "operation": "set", "parameters": {"value": true}}]}}
  - reply: Review the draft and save it in the browser to turn it on.
