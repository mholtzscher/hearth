id: dashboard-weather-first-try
title: A vague weather request presents its view without rejected attempts
tags: [dashboard, create, weather, retries]

# Each rejected view attempt makes the user wait for the model to write the
# whole layout again. The station's gateway and outdoor array have 19 sensors,
# more than a view may bind, so binding everything is itself a rejection.
turns:
  - text: show me the weather

checks:
  - kind: view_without_rejections

judge:
  criteria:
    - The view shows current outdoor conditions, not only indoor readings or a forecast.

max_requests: 12

reference:
  - call: list_devices
    arguments: '{}'
  - call: list_entities
    arguments: '{"device_id": "{{device:outdoor-weather-array}}"}'
  - call: list_entities
    arguments: '{"device_id": "{{device:weather-station-gateway}}"}'
  - call: tool_search
    arguments: '{"query": "select:compose_view"}'
  - call: compose_view
    arguments: |-
      {"mode": "create", "title": "Weather", "layout": {"type": "Stack", "gap": "medium", "children": [
        {"type": "OutsideNow", "entity_id": "{{entity:outdoor-weather-array/temperature}}", "humidity": "{{entity:outdoor-weather-array/humidity}}",
          "wind_speed": "{{entity:outdoor-weather-array/wind}}", "wind_direction": "{{entity:outdoor-weather-array/wind-direction}}",
          "rain_rate": "{{entity:outdoor-weather-array/rain-rate}}", "rain_today": "{{entity:outdoor-weather-array/daily-rain}}"},
        {"type": "Grid", "columns": 2, "children": [
          {"type": "Wind", "entity_id": "{{entity:outdoor-weather-array/wind}}", "gust": "{{entity:outdoor-weather-array/gust}}",
            "wind_direction": "{{entity:outdoor-weather-array/wind-direction}}", "max_gust": "{{entity:outdoor-weather-array/max-gust}}"},
          {"type": "Pressure", "entity_id": "{{entity:weather-station-gateway/relative-pressure}}"}]},
        {"type": "Rain", "entity_id": "{{entity:outdoor-weather-array/rain-rate}}", "storm": "{{entity:outdoor-weather-array/event-rain}}",
          "totals": {"day": "{{entity:outdoor-weather-array/daily-rain}}", "week": "{{entity:outdoor-weather-array/weekly-rain}}",
            "month": "{{entity:outdoor-weather-array/monthly-rain}}", "year": "{{entity:outdoor-weather-array/yearly-rain}}"}},
        {"type": "ReadingList", "title": "Indoor", "rows": [
          {"entity_id": "{{entity:weather-station-gateway/indoor-temperature}}"},
          {"entity_id": "{{entity:weather-station-gateway/indoor-humidity}}"}]}]}}
  - reply: ""
