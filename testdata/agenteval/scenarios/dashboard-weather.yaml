id: dashboard-weather
title: Weather cards bound to the station's matching sensors
tags: [dashboard, create, weather]

turns:
  - text: >-
      Build a weather dashboard from the Weather station showing current
      outdoor conditions, wind, and pressure.

checks:
  - kind: view
    view:
      cards:
        - type: OutsideNow
          bindings:
            temperature: {device: weather-station, key: temperature}
        - type: Wind
          bindings:
            speed: {device: weather-station, key: wind}
        - type: Pressure
          bindings:
            source: {device: weather-station, key: pressure}

judge:
  criteria:
    - Optional weather slots, if bound, use the Weather station's own sensors with the matching meaning.

max_requests: 12

reference:
  - call: list_entities
    arguments: '{"device_id": "{{device:weather-station}}"}'
  - call: tool_search
    arguments: '{"query": "select:compose_view"}'
  - call: compose_view
    arguments: |-
      {"mode": "create", "title": "Weather", "layout": {"type": "Stack", "gap": "medium", "children": [
        {"type": "OutsideNow", "temperature": "{{entity:weather-station/temperature}}", "humidity": "{{entity:weather-station/humidity}}", "wind": "{{entity:weather-station/wind}}", "wind_direction": "{{entity:weather-station/wind-direction}}"},
        {"type": "Grid", "columns": 2, "children": [
          {"type": "Wind", "speed": "{{entity:weather-station/wind}}", "gust": "{{entity:weather-station/gust}}", "direction": "{{entity:weather-station/wind-direction}}"},
          {"type": "Pressure", "entity_id": "{{entity:weather-station/pressure}}"}]}]}}
  - reply: ""
