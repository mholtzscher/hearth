# Local development brokers for Hearth.
#
# Every published port binds the host loopback interface only. NATS serves
# native NATS, JetStream, the dashboard websocket, and HTTP monitoring;
# Mosquitto owns MQTT 1883. Broker data persists under the ignored .data/
# directory. Start with `mise run brokers`.
name: hearth-local

services:
  nats:
    image: nats:2.12
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:4223:4223"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./configs/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./.data/nats:/data/nats

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./.data/mosquitto:/mosquitto/data
